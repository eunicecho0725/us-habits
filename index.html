<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Us">
<title>Mikey &amp; Euni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1E2420; --muted:#6B736D; --line:#E6E2D9;
  --accent:#5E8C61; --empty:#ECE9E2; --band:rgba(94,140,97,.08);
  --euni:#6FA77A; --mikey:#D58F58; --danger:#B4534F; --overlay:rgba(20,24,21,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151816; --surface:#1F2320; --ink:#E8ECE8; --muted:#9AA49C; --line:#2D332F;
    --accent:#8FBF8F; --empty:#2A2F2B; --band:rgba(143,191,143,.08);
    --euni:#8FBF8F; --mikey:#E8A876; --danger:#E08C88; --overlay:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151816; --surface:#1F2320; --ink:#E8ECE8; --muted:#9AA49C; --line:#2D332F;
  --accent:#8FBF8F; --empty:#2A2F2B; --band:rgba(143,191,143,.08);
  --euni:#8FBF8F; --mikey:#E8A876; --danger:#E08C88; --overlay:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:0 16px 40px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 0 8px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.9rem;font-weight:700;margin:0;letter-spacing:-.01em}
.iconbtn{appearance:none;border:0;background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;cursor:pointer;border:1px solid var(--line)}
.iconbtn.add{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:1.6rem;line-height:1}
.chips{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.legend{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);font-weight:600}
.legend .dot{width:10px;height:10px;border-radius:50%}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.92rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.weeknav .label{font-weight:600}
.weeknav .ctrl{display:flex;gap:6px;align-items:center}
.pillbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:.9rem}
.weeklabel{appearance:none;border:0;background:none;font-weight:600;font-size:.92rem;color:var(--accent);cursor:pointer;padding:6px 10px}

/* Shared grid */
.grid{display:grid;grid-template-columns:repeat(7,1fr);align-items:center;column-gap:2px}
.days{margin-top:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.day{text-align:center;font-size:.72rem;color:var(--muted);line-height:1.25;padding:2px 0;border-radius:8px}
.day b{display:block;font-size:.95rem;color:var(--ink);font-weight:600}
.day.today{background:var(--band)}
.day.today,.day.today b{color:var(--accent)}

/* Cards */
.list{display:flex;flex-direction:column;margin-top:4px;overflow-x:clip}
.slide-l{animation:slideL .28s ease-out}
.slide-r{animation:slideR .28s ease-out}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.closebar{appearance:none;width:100%;border:0;background:none;padding:14px 0 2px;cursor:pointer;display:flex;justify-content:center}
.closebar span{width:44px;height:5px;border-radius:3px;background:var(--line)}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}
.card{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.cardhead{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:10px;padding:2px 0 8px;cursor:pointer;text-align:left}
.emoji{font-size:1.35rem;width:30px;text-align:center}
.hname{font-weight:700;font-size:1.05rem;flex:1}
.target{font-size:.8rem;color:var(--muted);font-weight:500}
.prow{padding:3px 0}
.who{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--bg)}
.cell{display:grid;place-items:center;position:relative;padding:3px 0}
.cell.today{background:none}
.circle{appearance:none;border:2px solid transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;width:100%;max-width:48px;height:auto;aspect-ratio:1;border-radius:50%;background:var(--empty);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.02rem;font-weight:700;line-height:1;color:var(--ink);padding:0;transition:transform .12s}
.circle:active{transform:scale(.9)}
.circle.off{background:radial-gradient(circle,var(--line) 3px,transparent 3.5px);border:2px solid transparent;color:var(--muted)}
.circle:not(.off){border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.circle[style*="background"]{border-color:transparent}
.circle small{font-size:.62rem;font-weight:600;opacity:.75;margin-bottom:2px;letter-spacing:.02em}
.circle.future{opacity:.35;cursor:default}
.memo-dot{position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.count{text-align:right;font-size:.85rem;font-weight:700;color:var(--muted)}
.count.met{color:var(--accent)}
.stats{font-size:.82rem;color:var(--muted);margin:8px 2px 0;display:flex;flex-wrap:wrap;gap:4px 12px}
.stats span{display:inline-flex;align-items:center;gap:5px}
.stats i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats b.met{color:var(--accent)}
.dpills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.dpill{appearance:none;width:100%;aspect-ratio:1;padding:0;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:.85rem;cursor:pointer}
.dpill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
input[type=date]{display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;text-align:left;min-height:42px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet{overflow-x:hidden}

.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;margin-top:10px}
#banner{position:fixed;right:max(16px, calc((100vw - 480px)/2 + 16px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:14;pointer-events:none}
.banner{font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* Sheets */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheethead h2{flex:1;margin:0;font-size:1.25rem}
.seg{display:flex;background:var(--empty);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sstats{font-size:.88rem;color:var(--muted);margin:12px 0 4px}
.dayrow{border-top:1px solid var(--line);padding:12px 0}
.dayline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlabel{font-weight:600}
.dlabel small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.toggle{appearance:none;border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;min-width:96px}
.toggle.on{color:var(--bg);border-color:transparent}
.toggle:disabled{opacity:.45;cursor:default}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;resize:none}
.memo-ro{margin-top:6px;font-size:.92rem;color:var(--muted);white-space:pre-wrap}
.footer{display:flex;gap:8px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;flex:1}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
label.f{display:block;font-weight:600;font-size:.9rem;margin-top:14px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px}
.stepper span{font-weight:700;font-size:1.1rem;min-width:70px;text-align:center}
.who-big{display:flex;gap:12px;margin-top:16px}
.who-big button{flex:1;padding:22px 10px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.1rem;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Day dropdown */
.panel{position:relative;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel::before{content:"";position:absolute;top:-7px;left:var(--x,50%);width:12px;height:12px;background:var(--bg);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.phead b{font-size:1rem}
.xbtn{appearance:none;border:0;background:none;font-size:1.2rem;color:var(--muted);cursor:pointer;padding:2px 6px}
.status{display:flex;gap:8px}
.status button{appearance:none;flex:1;padding:12px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.status button:active{transform:scale(.92)}
.status .em{font-size:1.15rem;line-height:1}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.both{text-align:center;font-weight:700;padding:10px;border-radius:999px;margin-bottom:10px;background:linear-gradient(90deg,var(--euni-v),var(--mikey-v));background:linear-gradient(in oklch 90deg,var(--euni-v),var(--mikey-v));color:#16201A}
.burst{position:absolute;top:-6px;font-size:1.1rem;pointer-events:none;animation:burst 1s ease-out forwards}
@keyframes burst{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-28px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.burst{display:none}}
.status button[aria-pressed="true"]{border-color:transparent;color:#16201A}
.status button.notdone[aria-pressed="true"]{background:var(--empty);color:var(--ink);border-color:var(--line)}
.plabel{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.partner{font-size:.9rem;margin-top:4px;display:flex;gap:8px;align-items:flex-start}
.partner i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.partner span{color:var(--muted)}
.todo{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.todo:last-of-type{border-bottom:0}
.tbox{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:none;cursor:pointer;flex:none;font-size:.8rem;font-weight:700;padding:0}
.tbox[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.ttext{flex:1;font-size:.95rem}
.adot{width:8px;height:8px;border-radius:50%;flex:none}
.ttext.done{text-decoration:line-through;color:var(--muted)}
.addtodo{display:flex;gap:6px;margin-top:6px}
.addtodo input{margin-top:0}
.addtodo button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.circle.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}


.panel{padding:10px 12px 4px}
.phead{margin-bottom:8px}
.rest{color:var(--muted);font-weight:500}
.pchip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status button{padding:9px 8px;font-size:.95rem}
.both{padding:7px;margin-bottom:8px;font-size:.92rem}
.notes{margin-top:6px}
.todo{padding:5px 0}
.addlink{appearance:none;border:0;background:none;color:var(--muted);font-weight:600;padding:10px 2px 2px;cursor:pointer;font-size:.92rem}
.addtodo{margin-top:8px}
.closebar{padding:10px 0 4px}
.circle{background-origin:border-box}
.tleft{display:flex;align-items:center;gap:2px;min-width:0}
.tleft h1{white-space:nowrap;font-size:clamp(1.4rem,6.5vw,1.9rem)}
.navarrow{appearance:none;border:0;background:none;font-size:1.9rem;line-height:1;color:var(--muted);padding:2px 8px 6px;cursor:pointer;border-radius:10px}
.navarrow:first-child{margin-left:-8px}
.navarrow:active{background:var(--surface)}
.weeknav{justify-content:flex-start;margin-top:2px}
.weeklabel{padding:2px 0}
:root{--both:#E2B95A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--both:#EAC872}}
:root[data-theme="dark"]{--both:#EAC872}
.dayhead{margin-top:10px;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.dh{text-align:center;font-size:.7rem;font-weight:600;color:var(--muted);line-height:1.25}
.dh b{display:block;font-size:1rem;color:var(--ink)}
.dh.today{color:var(--accent)}
.dh.today b{color:var(--bg);background:var(--accent);border-radius:999px;width:28px;height:28px;line-height:28px;margin:2px auto 0}
.streak{display:inline-flex;align-items:center;gap:1px;margin-left:8px;font-size:.78rem;font-weight:800;padding:2px 8px 2px 6px;border-radius:999px;background:rgba(232,128,48,.16);color:#D8732A;vertical-align:2px}
.streak.hot{animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.streak.hot{animation:none}}
.tip{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 16px 12px;z-index:16;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.tip[hidden]{display:none}
.tip p{margin:0 0 4px;font-size:.93rem}
.tip button{appearance:none;margin-top:8px;width:100%;border:0;border-radius:999px;padding:10px;font-weight:700;background:var(--accent);color:var(--bg);cursor:pointer}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.presets button{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.presets button:active{transform:scale(.95)}
.app{padding-bottom:110px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.fab:active{transform:scale(.9)}
.hemoji{margin-right:.35em}
.namerow{display:flex;gap:10px;align-items:center;margin-top:14px}
.namerow input{margin-top:0;flex:1;min-width:0;font-size:1.05rem;padding:12px}
.avatar{appearance:none;width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--line);background:var(--bg);font-size:1.6rem;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.avatar .ph{font-size:1.3rem;color:var(--muted)}
.epick{margin-top:10px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:200px;overflow-y:auto}
.enone{grid-column:1/-1;color:var(--muted);font-size:.9rem;padding:8px}
.epick[hidden]{display:none}
.eopt{appearance:none;border:0;background:none;font-size:1.4rem;aspect-ratio:1;border-radius:10px;cursor:pointer;padding:0}
.eopt[aria-pressed="true"]{background:var(--band)}
.epick input{margin:0 0 8px;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.cardhead{cursor:default}
.editbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
body.panel-open .app{padding-bottom:45vh}

.bottombar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;z-index:15;pointer-events:none}
.bottombar>*{pointer-events:auto}
.bottombar .fab{position:static}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tabs button{appearance:none;border:0;background:none;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:.95rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tsum{padding:14px 0 6px}
.tsum b{font-size:1.15rem}
.tgroup{margin-top:14px}
.tglabel{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 2px}
.tglabel::after{content:"";flex:1;height:1px;background:var(--line)}
.trow-wrap{border-bottom:1px solid var(--line);padding:6px 0}
.trow-wrap:last-child{border-bottom:0}
.trow{display:flex;align-items:center;gap:12px}
.tinfo{flex:1;min-width:0}
.tname{font-weight:700;font-size:1.08rem}
.tmeta{font-size:.84rem;color:var(--muted);margin-top:2px}
.circle.big{width:54px;max-width:none;font-size:1.4rem}
.restline{margin-top:18px;font-size:.85rem;color:var(--muted)}
.extra{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.amt{display:flex;align-items:center;gap:8px}
.amt input{width:110px;margin:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.amt span{color:var(--muted);font-weight:600}
.feel{display:flex;gap:6px}
.feel button{appearance:none;flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 6px;font-weight:600;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.feel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===================== iPhone (HIG) style ===================== */
/* Semantic colors (UIKit system values), Dynamic Type default sizes, 8-pt spacing, 44-pt targets */
:root{
  /* system colors */
  --sys-blue:#007AFF; --sys-green:#34C759; --sys-orange:#FF9500; --sys-red:#FF3B30; --sys-indigo:#5856D6; --sys-pink:#FF2D55; --sys-yellow:#FFCC00;
  /* labels */
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3);
  /* backgrounds (grouped) */
  --bg-grouped:#F2F2F7; --bg-grouped-2:#FFFFFF; --bg-grouped-3:#F2F2F7;
  /* fills */
  --fill-1:rgba(120,120,128,.2); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(118,118,128,.12); --fill-4:rgba(116,116,128,.08);
  /* separators */
  --separator:rgba(60,60,67,.29); --separator-opaque:#C6C6C8;
  /* materials */
  --material-thin:rgba(249,249,249,.7); --material-thick:rgba(242,242,247,.9);
  /* type scale (Dynamic Type, Large default) */
  --t-largetitle:34px; --t-title1:28px; --t-title2:22px; --t-title3:20px; --t-headline:17px; --t-body:17px; --t-callout:16px; --t-subhead:15px; --t-footnote:13px; --t-caption1:12px; --t-caption2:11px;
  /* spacing & shape */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --tap:44px;
  --r-list:10px; --r-control:10px; --r-button:12px; --r-sheet:14px;

  /* map app tokens to HIG semantics */
  --bg:var(--bg-grouped); --surface:var(--bg-grouped-2); --ink:var(--label); --muted:var(--label-2);
  --line:var(--separator); --sep:var(--separator); --accent:var(--sys-blue);
  --euni:var(--sys-green); --mikey:var(--sys-orange); --danger:var(--sys-red); --overlay:rgba(0,0,0,.2);
  --fill:var(--fill-3); --fill2:var(--fill-4); --empty:var(--fill-3); --band:transparent;
  --glass:var(--material-thin); --glass-strong:var(--material-thick);
}
@media (prefers-color-scheme:dark){

    --sys-blue:#0A84FF; --sys-green:#30D158; --sys-orange:#FF9F0A; --sys-red:#FF453A; --sys-indigo:#5E5CE6; --sys-pink:#FF375F; --sys-yellow:#FFD60A;

<script>
/* ===== Sync setup (step 2): paste your Firebase config here ===== */
const FIREBASE_CONFIG = null;   // e.g. {apiKey:"...", authDomain:"...", projectId:"...", appId:"..."}
/* The room id is never written in this file (the repo is public). Open the app once per phone
   with ...github.io/us-habits/#room=<id>; it is remembered on that phone. Keep the #room part in
   the address when adding to the Home Screen, since the Home Screen app has its own storage. */
const LS_ROOM = "us-habits-room";
const ROOM_ID = (()=>{
  const ok = s => /^[A-Za-z0-9_-]{16,128}$/.test(s||"") ? s : "";
  let r = "";
  try{ r = ok(decodeURIComponent((location.hash.match(/[#&]room=([^&]*)/)||[])[1]||"")); }catch(e){}
  try{ if(r) localStorage.setItem(LS_ROOM,r); else r = ok(localStorage.getItem(LS_ROOM)); }catch(e){}
  return r;
})();
/* ================================================================ */

const PEOPLE = [
  {id:"euni",  name:"Euni",  color:"var(--euni)"},
  {id:"mikey", name:"Mikey", color:"var(--mikey)"}
];
const LS_DATA = "us-habits-data-v1", LS_ME = "us-habits-me";
const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const FEELS = [{id:"easy",e:"😌",n:"Easy"},{id:"good",e:"🙂",n:"Good"},{id:"tough",e:"😮‍💨",n:"Tough"}];
const TODS = [{id:"morning",e:"🌅",n:"Morning"},{id:"afternoon",e:"☀️",n:"Afternoon"},{id:"evening",e:"🌙",n:"Evening"},{id:"anytime",e:"✨",n:"Anytime"}];
const feelE = id => (FEELS.find(f=>f.id===id)||{}).e||"";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- dates ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-x.getDay()); return x; };
const today = () => ymd(new Date());
const weekDays = ws => Array.from({length:7},(_,i)=>ymd(addDays(ws,i)));

/* ---------- state ---------- */
const state = { tab:"today", mode:null, habits:{}, checks:{}, todos:{}, me:null, week:weekStart(new Date()), sel:null, editing:null };
try { state.me = localStorage.getItem(LS_ME); state.tab = localStorage.getItem("us-habits-tab")||"today"; } catch(e){}

const ck = (hid,p,date) => `${hid}_${p}_${date}`;
const tk = (hid,date) => `${hid}_${date}`;
const sched = h => Array.isArray(h.days)&&h.days.length ? h.days : [0,1,2,3,4,5,6];
const isSched = (h,date) => sched(h).includes(parse(date).getDay());
const started = (h,date) => date >= (h.start||h.created||"0000");
const check = (hid,p,date) => state.checks[ck(hid,p,date)];
const done = (hid,p,date) => !!(check(hid,p,date)||{}).done;
const todoItems = (hid,date) => ((state.todos[tk(hid,date)]||{}).items)||[];
const person = id => PEOPLE.find(p=>p.id===id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- stats ---------- */
function weekCount(h,p,ws){ return weekDays(ws).filter(d=>isSched(h,d)&&done(h.id,p,d)).length; }
function weekTarget(h){ return sched(h).length; }
function streak(h,p){
  let d=new Date(), n=0, guard=0;
  if(!done(h.id,p,ymd(d))) d=addDays(d,-1);
  while(guard++<3650){
    const s=ymd(d); if(!started(h,s)) break;
    if(isSched(h,s)){ if(done(h.id,p,s)) n++; else break; }
    d=addDays(d,-1);
  }
  return n;
}

/* ---------- storage backends ---------- */
let backend;
const syncing = () => backend===remote;
const local = {
  init(){ try{ const s=JSON.parse(localStorage.getItem(LS_DATA)||"null"); if(s){ state.habits=s.habits||{}; state.checks=s.checks||{}; state.todos=s.todos||{}; } }catch(e){} render(); },
  save(){ try{ localStorage.setItem(LS_DATA, JSON.stringify({habits:state.habits,checks:state.checks,todos:state.todos})); }catch(e){} },
  setHabit(h){ state.habits[h.id]=h; this.save(); render(); },
  deleteHabit(id){ delete state.habits[id];
    for(const k in state.checks) if(state.checks[k].habitId===id) delete state.checks[k];
    for(const k in state.todos) if(state.todos[k].habitId===id) delete state.todos[k];
    this.save(); render(); },
  setCheck(key,val){ if(val) state.checks[key]=val; else delete state.checks[key]; this.save(); render(); },
  setTodos(key,val){ if(val) state.todos[key]=val; else delete state.todos[key]; this.save(); render(); }
};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
const remote = {
  async init(){
    await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.firestore();
    const base = `rooms/${ROOM_ID}`;
    this.H = this.db.collection(base+"/habits");
    this.C = this.db.collection(base+"/checks");
    this.T = this.db.collection(base+"/todos");
    try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    this.cutoff = ymd(addDays(new Date(),-120));
    this.live={checks:{},todos:{}}; this.old={checks:{},todos:{}}; this.loadedWeeks=new Set();
    const merge = key => { state[key]={...this.old[key],...this.live[key]}; render(); };
    this.H.onSnapshot(s=>{ const o={}; s.forEach(d=>o[d.id]=d.data()); state.habits=o; render(); });
    this.C.where("date",">=",this.cutoff).onSnapshot(s=>{ const o={}; s.forEach(d=>o[d.id]=d.data()); this.live.checks=o; merge("checks"); });
    this.T.where("date",">=",this.cutoff).onSnapshot(s=>{ const o={}; s.forEach(d=>o[d.id]=d.data()); this.live.todos=o; merge("todos"); });
  },
  async ensureWeek(ws){
    const days=weekDays(ws); if(days[6]>=this.cutoff || this.loadedWeeks.has(days[0])) return;
    this.loadedWeeks.add(days[0]);
    for(const [col,key] of [[this.C,"checks"],[this.T,"todos"]]){
      const snap=await col.where("date",">=",days[0]).where("date","<=",days[6]).get();
      snap.forEach(d=>this.old[key][d.id]=d.data());
      state[key]={...this.old[key],...this.live[key]};
    }
    render();
  },
  async fetchAll(){
    const out={};
    for(const [col,key] of [[this.H,"habits"],[this.C,"checks"],[this.T,"todos"]]){ out[key]={}; (await col.get()).forEach(d=>out[key][d.id]=d.data()); }
    return out;
  },
  addMemo(h,d,item){ this.T.doc(tk(h,d)).set({habitId:h,date:d,items:firebase.firestore.FieldValue.arrayUnion(item)},{merge:true}); },
  removeMemo(h,d,item){ this.T.doc(tk(h,d)).update({items:firebase.firestore.FieldValue.arrayRemove(item)}); },
  setHabit(h){ this.H.doc(h.id).set(h); },
  async deleteHabit(id){
    const b=this.db.batch();
    (await this.C.where("habitId","==",id).get()).forEach(d=>b.delete(d.ref));
    (await this.T.where("habitId","==",id).get()).forEach(d=>b.delete(d.ref));
    b.delete(this.H.doc(id)); await b.commit();
  },
  setCheck(key,val){ val ? this.C.doc(key).set(val) : this.C.doc(key).delete(); },
  setTodos(key,val){ val ? this.T.doc(key).set(val) : this.T.doc(key).delete(); }
};

/* ---------- actions ---------- */
function setDone(hid,p,date,val){
  const hb=state.habits[hid];
  if(val && hb && date < (hb.start||hb.created||date)) backend.setHabit({...hb,start:date});
  const key=ck(hid,p,date), cur=state.checks[key]||{habitId:hid,person:p,date,memo:""};
  if(val) backend.setCheck(key,{...cur,done:true});
  else if(cur.memo) backend.setCheck(key,{...cur,done:false});
  else backend.setCheck(key,null);
}
function setMemo(hid,p,date,memo){
  const key=ck(hid,p,date), cur=state.checks[key]||{habitId:hid,person:p,date,done:false};
  memo=memo.trim();
  if(!memo && !cur.done) backend.setCheck(key,null); else backend.setCheck(key,{...cur,memo});
}
function setField(hid,p,date,k,v){ const key=ck(hid,p,date), cur=state.checks[key]; if(!cur||!cur.done) return; backend.setCheck(key,{...cur,[k]:v}); }
function saveTodos(hid,date,items){ backend.setTodos(tk(hid,date), items.length?{habitId:hid,date,items}:null); }

/* ---------- device preferences: hand & appearance ---------- */
const HAND_KEY="us-habits-hand", THEME_KEY="us-habits-appearance";
function handPref(){ try{ const v=localStorage.getItem(HAND_KEY); if(v) return v; }catch(e){} return state.me==="euni"?"left":"right"; }
function themePref(){ try{ return localStorage.getItem(THEME_KEY)||"auto"; }catch(e){ return "auto"; } }
function applyPrefs(){
  const t=themePref(); if(t==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  document.body.classList.toggle("lefty", handPref()==="left");
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
let deferred=false, POP=null, lastOpened=null;
function render(){
  const ae=document.activeElement;
  if(ae && ae.closest && ae.closest(".panel") && (ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")){ deferred=true; return; }
  deferred=false;
  POP=state.pop; state.pop=null;
  applyPrefs();
  $("chips").style.display="none";
  $("title").textContent = state.tab==="today" ? new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}) : state.tab==="log" ? "Log" : weekRange(state.week);
  const isCur = weekStart(state.week).getTime()===weekStart(new Date()).getTime();
  document.querySelector(".top .weeknav").style.display = state.tab==="week" && !isCur ? "" : "none";
  document.querySelectorAll(".wk").forEach(b=>b.style.display = state.tab==="week" ? "" : "none");
  $("dayHead").style.display = state.tab==="week" && Object.keys(state.habits).length ? "" : "none";
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===state.tab));
  $("banner").innerHTML = syncing() ? "" : `<div class="banner">${FIREBASE_CONFIG&&!ROOM_ID?"Not connected: open your private link once on this phone":"Preview: saved on this phone only"}</div>`;
  const hs=Object.values(state.habits).sort((x,y)=>(x.order||0)-(y.order||0));
  if(!hs.length) $("list").innerHTML=`<div class="empty">No habits yet.<br>Tap <b>+</b> to add one you’ll do together.</div>`;
  else $("list").innerHTML = state.tab==="week" ? weekHTML(hs) : state.tab==="log" ? logHTML(hs) : todayHTML(hs);
  let seen=true; try{ seen=localStorage.getItem("us-habits-tip")==="1"; }catch(e){}
  $("tip").hidden = seen || !hs.length || !state.me;
  const open=!!document.querySelector(".panel");
  document.body.classList.toggle("panel-open",open);
  if(!open) state.adding=false;
  const key=state.sel?state.tab+state.sel.h+state.sel.d:null;
  if(open && key!==lastOpened){ const pn=document.querySelector(".panel"); requestAnimationFrame(()=>pn.scrollIntoView({behavior:"smooth",block:"nearest"})); }
  lastOpened=key;
}

function circleStyle(who){
  if(who.length===1) return `background:${who[0].color};color:var(--on-fill)`;
  if(who.length===2) return `background:linear-gradient(135deg,var(--euni-v),var(--mikey-v));background:linear-gradient(in oklch 135deg,var(--euni-v),var(--mikey-v));color:var(--on-fill)`;
  return "";
}
function circleGlyph(who){ return who.length ? "✓" : ""; }
function amountSum(h,p,ws){ return weekDays(ws).reduce((n,d)=>n+(+((check(h.id,p,d)||{}).done&&(check(h.id,p,d)||{}).amount)||0),0); }

function weekRange(ws){ const days=weekDays(ws), a0=parse(days[0]), b0=parse(days[6]); return `${MON[a0.getMonth()]} ${a0.getDate()} – ${a0.getMonth()!==b0.getMonth()?MON[b0.getMonth()]+" ":""}${b0.getDate()}`; }
function weekHTML(hs){
  const days=weekDays(state.week), t=today();
  const diff=Math.round((weekStart(state.week)-weekStart(new Date()))/(7*864e5));
  $("weekLabel").textContent = diff===0 ? "" : "↩ Back to this week";
  $("dayHead").innerHTML = days.map(d=>`<div class="dh${d===t?" today":""}">${DOW[parse(d).getDay()]}<b>${parse(d).getDate()}</b></div>`).join("");
  return hs.map(h=>{
    const cells = days.map(d=>{
      const who = PEOPLE.filter(p=>done(h.id,p.id,d));
      const fut = d>t, off = !isSched(h,d);
      const isSel = state.sel && state.sel.h===h.id && state.sel.d===d;
      const isPop = POP && POP.h===h.id && POP.d===d;
      const extra = todoItems(h.id,d).length;
      const label = who.length ? who.map(p=>p.name).join(" and ")+" did it" : (off?"rest day":"not done");
      return `<div class="cell${d===t?" today":""}"><button class="circle${off&&!who.length?" off":""}${fut?" future":""}${isSel?" sel":""}${isPop?" pop":""}" data-h="${h.id}" data-d="${d}" ${fut?"disabled":""} style="${circleStyle(who)}" aria-label="${d}: ${label}">${circleGlyph(who)}${noteBadge(h.id,d)}</button>${isPop&&who.length===2?`<span class="burst" aria-hidden="true">🎉</span>`:""}</div>`;
    }).join("");
    const tgt = weekTarget(h);
    const counts = PEOPLE.map(p=>{ const c=weekCount(h,p.id,state.week), sum=h.unit?amountSum(h,p.id,state.week):0; return `<span><i style="background:${p.color}"></i>${p.name} <b class="${c>=tgt?"met":""}">${c}/${tgt}</b>${sum?` · ${sum} ${esc(h.unit)}`:""}</span>`; }).join("");
    const sk=streak(h,state.me||"euni");
    const dl = sched(h).length===7 ? "Every day" : sched(h).map(i=>DOW[i]).join(" ");
    const showPanel = state.sel && state.sel.h===h.id && days.includes(state.sel.d);
    return `<div class="card">
      <div class="cardhead"><span class="hname">${h.emoji?`<span class="hemoji">${esc(h.emoji)}</span>`:""}${esc(h.name)}${sk?`<span class="streak${sk>=7?" hot":""}" aria-label="${sk} day streak">🔥${sk}</span>`:""}</span><button class="target editbtn" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}">${dl} ›</button></div>
      <div class="grid">${cells}</div>
      ${showPanel ? panel(h, state.sel.d, `${(days.indexOf(state.sel.d)+0.5)/7*100}%`) : ""}
    </div>`;
  }).join("");
}

function logHTML(hs){
  const byDate={}, add=(d,e)=>(byDate[d]=byDate[d]||[]).push(e);
  Object.values(state.todos).forEach(t=>{ const h=state.habits[t.habitId]; if(!h) return; (t.items||[]).forEach(it=>add(t.date,{h,by:it.by,text:it.text,done:it.done,d:t.date})); });
  Object.values(state.checks).forEach(c=>{ const h=state.habits[c.habitId]; if(!h||!c.done||!c.amount) return; add(c.date,{h,by:c.person,text:`${c.amount} ${h.unit||""}`.trim(),amt:true,d:c.date}); });
  const dates=Object.keys(byDate).sort().reverse();
  if(!dates.length) return `<div class="empty">Memos you leave on any day will show up here.</div>`;
  const y=ymd(addDays(new Date(),-1));
  return dates.map(d=>{
    const lbl = d===today()?"Today" : d===y?"Yesterday" : parse(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    return `<div class="tgroup"><div class="tglabel" role="heading" aria-level="2"><span>${lbl}</span></div>${byDate[d].map(e=>`<button class="lrow" data-logh="${e.h.id}" data-logd="${e.d}"><i class="adot" style="background:${(person(e.by)||{}).color||"var(--muted)"}"></i><span class="ltext"><span class="lhabit">${e.h.emoji?esc(e.h.emoji)+" ":""}${esc(e.h.name)}</span><span class="lnote${e.done?" done":""}">${e.amt?"Logged ":""}${esc(e.text)}</span></span></button>`).join("")}</div>`;
  }).join("");
}
function noteBadge(hid,d){
  const items=todoItems(hid,d); if(!items.length) return "";
  const by=[...new Set(items.map(i=>i.by))].map(person).filter(Boolean);
  const bg = by.length>1 ? "linear-gradient(135deg,var(--euni),var(--mikey))" : (by[0]||{}).color||"var(--accent)";
  return `<span class="nbadge" style="background:${bg}" title="Has notes"></span>`;
}
function todayHTML(hs){
  const t=today(), dd=new Date();
  const due=hs.filter(h=>started(h,t)&&isSched(h,t)), rest=hs.filter(h=>!due.includes(h));
  const other=PEOPLE.find(p=>p.id!==state.me)||PEOPLE[1];
  const sum = PEOPLE.map(p=>`<span><i style="background:${p.color}"></i>${p.name} <b>${due.filter(h=>done(h.id,p.id,t)).length}/${due.length}</b></span>`).join("");
  const row = h=>{
    const who=PEOPLE.filter(p=>done(h.id,p.id,t)), mine=check(h.id,state.me,t)||{}, oc=check(h.id,other.id,t)||{};
    const isPop=POP&&POP.h===h.id&&POP.d===t, isSel=state.sel&&state.sel.h===h.id&&state.sel.d===t;
    const notes=todoItems(h.id,t).length;
    const meta=[];
    if(mine.done && (mine.amount||mine.feel)) meta.push(`You ${mine.amount?`${mine.amount} ${esc(h.unit||"")}`:""} ${feelE(mine.feel)}`.trim());
    meta.push(`${esc(other.name)} ${oc.done?`✓ ${feelE(oc.feel)}`:"not yet"}`.trim());
    if(notes) meta.push(`📝 ${notes}`);
    return `<div class="trow-wrap"><div class="trow">
      <div class="tinfo"><div class="tname">${h.emoji?`<span class="hemoji">${esc(h.emoji)}</span>`:""}${esc(h.name)}</div></div>
      <div class="cell"><button class="circle big${isSel?" sel":""}${isPop?" pop":""}" data-h="${h.id}" data-d="${t}" style="${circleStyle(who)}" aria-label="${esc(h.name)}${who.length?": "+who.map(p=>p.name).join(" and ")+" did it":""}">${circleGlyph(who)}${noteBadge(h.id,t)}</button>${isPop&&who.length===2?`<span class="burst" aria-hidden="true">🎉</span>`:""}</div>
    </div>${isSel?panel(h,t,handPref()==="left"?"28px":"calc(100% - 28px)"):""}</div>`;
  };
  const groups = TODS.map(g=>{ const items=due.filter(h=>(h.tod||"anytime")===g.id); return items.length?`<div class="tgroup"><div class="tglabel" role="heading" aria-level="2"><span>${g.n}</span></div>${items.map(row).join("")}</div>`:""; }).join("");
  return `${due.length?groups:`<div class="empty">Nothing scheduled today 🌿</div>`}`;
}

function panel(h,d,xpos){
  const me=state.me, mine=check(h.id,me,d)||{}, myColor=person(me).color, dd=parse(d);
  const other=PEOPLE.find(p=>p.id!==me), oc=check(h.id,other.id,d)||{};
  const items=todoItems(h.id,d), pp=POP&&POP.h===h.id&&POP.d===d;
  const x = xpos;
  return `<div class="panel" style="--x:${x}">
    <div class="phead">
      <b>${DAYN[dd.getDay()]}, ${MON[dd.getMonth()]} ${dd.getDate()}${!isSched(h,d)?' <span class="rest">· rest day</span>':""}</b>
    </div>
    ${(mine.done&&oc.done)?`<div class="both${pp?" pop":""}">🎉 You both did it!</div>`:""}
    ${mine.done&&h.unit?`<div class="extra">
      <div class="amt"><input type="number" inputmode="decimal" min="0" data-amt value="${mine.amount??""}" placeholder="0"><span>${esc(h.unit)}</span></div>
    </div>`:""}
    ${items.length?`<div class="notes">${items.map(it=>`<div class="todo"><span class="ttext">${esc(it.text)}</span><i class="adot" title="${esc((person(it.by)||{}).name||"")}" style="background:${(person(it.by)||{}).color||"var(--muted)"}"></i><button class="xbtn" data-td="${it.id}" aria-label="Remove">×</button></div>`).join("")}</div>`:""}
    ${state.adding
      ? `<div class="addtodo"><input type="text" id="todoIn" maxlength="120" placeholder="Write a memo…" enterkeyhint="done"><button data-act="addtodo">Save</button></div>`
      : `<button class="addlink" data-act="startadd">+ Add a memo</button>`}
    <button class="closebar" data-act="pclose" aria-label="Close"><span></span></button>
  </div>`;
}

function autoEmoji(name){
  if(emojiManual) return;
  const skip=["morning","evening","night","daily","every","the","and","with","for"];
  const words=name.toLowerCase().split(/\s+/).filter(w=>w.length>=3&&!skip.includes(w)).reverse();
  for(const w of words){ const c=EMOJI_DB.find(([e,k])=>k.split(" ").some(x=>x.startsWith(w))); if(c){ setEmoji(c[0],false); return; } }
  for(const w of words){ const r=searchEmoji(w); if(r.length && r!==EMOJIS){ setEmoji(r[0],false); return; } }
  if(!name.trim()) setEmoji("",false);
}

}
function whoForm(){
  openSheet(`<div class="sheethead"><h2>Who’s using this phone?</h2></div>
    <p style="color:var(--muted);margin:0">You can only check off your own days. Change this anytime in settings.</p>
    <div class="who-big">${PEOPLE.map(p=>`<button data-me="${p.id}" style="border-color:${p.color}">${p.name}</button>`).join("")}</div>`);
}
function menuForm(){
  openSheet(`<div class="sheethead"><h2>Settings</h2><button class="iconbtn" data-act="close" aria-label="Close">×</button></div>
    <label class="f">This phone belongs to</label>
    <div class="seg" style="margin-top:8px">${PEOPLE.map(p=>`<button data-me="${p.id}" aria-pressed="${p.id===state.me}">${p.name}</button>`).join("")}</div>
    <label class="f">Check with</label>
    <div class="seg" style="margin-top:8px"><button data-hand="left" aria-pressed="${handPref()==="left"}">✋ Left hand</button><button data-hand="right" aria-pressed="${handPref()==="right"}">Right hand 🤚</button></div>
    <label class="f">Appearance</label>
    <div class="seg" style="margin-top:8px">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([v,n])=>`<button data-th="${v}" aria-pressed="${themePref()===v}">${n}</button>`).join("")}</div>
    <p class="sstats">${syncing()?"Syncing is on.":FIREBASE_CONFIG&&!ROOM_ID?"Not connected: open your private link (ending in #room=…) once on this phone.":"Preview mode: data stays on this device until syncing is set up."}</p>
    <label class="f">Backup</label><div class="footer" style="margin-top:8px"><button class="btn" data-act="export">Download a backup</button></div>
    ${syncing()?"":`<label class="f">Try it out</label><div class="footer" style="margin-top:8px"><button class="btn" data-act="simfill">Simulate ${esc(otherP().name)}’s check-ins</button></div><div class="footer" style="margin-top:8px"><button class="btn" data-act="simclear">Clear simulated data</button></div>`}`);
}

function addTodo(){
  const inp=$("todoIn"); if(!inp||!state.sel) return;
  const text=inp.value.trim(); if(!text) return;
  const {h,d}=state.sel; inp.value=""; state.adding=false; inp.blur();
  const item={id:uid(),text,done:false,by:state.me};
  if(backend.addMemo) backend.addMemo(h,d,item); else saveTodos(h,d,[...todoItems(h,d),item]);
}

/* ---------- preview helper: simulate the other person ---------- */
const otherP=()=>PEOPLE.find(p=>p.id!==(state.me||"euni"));
function simulate(){
  const o=otherP(), t=today(), days=weekDays(weekStart(new Date()));
  const notes=["Felt great today!","Did it before work","Short one today","Let’s do this together tomorrow"];
  Object.values(state.habits).forEach(h=>{
    days.forEach(d=>{
      if(d>t||!isSched(h,d)||!started(h,d)) return;
      if(d!==t && Math.random()<0.3) return;
      state.checks[ck(h.id,o.id,d)]={habitId:h.id,person:o.id,date:d,done:true,memo:"",feel:FEELS[Math.floor(Math.random()*3)].id,amount:h.unit?Math.ceil(Math.random()*30):null,sample:true};
    });
    if(isSched(h,t)&&started(h,t)){
      const key=tk(h.id,t), cur=state.todos[key]||{habitId:h.id,date:t,items:[]};
      cur.items=[...(cur.items||[]),{id:uid(),text:notes[Math.floor(Math.random()*notes.length)],done:false,by:o.id,sample:true}];
      state.todos[key]=cur;
    }
  });
  local.save(); render();
}
function clearSim(){
  for(const k in state.checks) if(state.checks[k].sample) delete state.checks[k];
  for(const k in state.todos){ const t=state.todos[k]; t.items=(t.items||[]).filter(i=>!i.sample); if(!t.items.length) delete state.todos[k]; }
  local.save(); render();
}

async function exportBackup(){
  const data = backend.fetchAll ? await backend.fetchAll() : {habits:state.habits,checks:state.checks,todos:state.todos};
  data.exported=new Date().toISOString();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`us-habits-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- after-check hint: teaches long press, offers a shortcut ---------- */
let toastTimer=null, toastTarget=null;
function showDetailsToast(h,d){
  let n=0; try{ n=+(localStorage.getItem("us-habits-hintcount")||0); }catch(e){}
  if(n>=8) return;
  try{ localStorage.setItem("us-habits-hintcount", n+1); }catch(e){}
  toastTarget={h,d};
  const el=$("toast"); el.hidden=false; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.hidden=true; },3500);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(suppressClick){ suppressClick=false; if(e.target.closest(".circle")) return; }
  if(state.sel && !e.target.closest(".panel") && !e.target.closest(".sheet")){
    state.sel=null; render();
    if(!e.target.closest("button")) return;
  }
  const t=e.target.closest("button"); if(!t){ if(e.target.id==="ov") closeSheet(); return; }
  if(t.id==="addBtn"){ habitForm(); return; }
  if(t.id==="menuBtn"){ menuForm(); return; }
  if(t.id==="prevW"){ changeWeek(-1); return; }
  if(t.id==="nextW"){ changeWeek(1); return; }
  if(t.id==="weekLabel"){ state.week=weekStart(new Date()); state.sel=null; render(); return; }
  if(t.dataset.edit){ habitForm(state.habits[t.dataset.edit]); return; }
  if(t.classList.contains("circle")){
    if(suppressClick){ suppressClick=false; return; }
    if(!state.me){ whoForm(); return; }
    const {h,d}=t.dataset, now=!done(h,state.me,d);
    if(now) state.pop={h,d};
    setDone(h,state.me,d,now);
    if(now) showDetailsToast(h,d);
    return;
  }
  if(t.dataset.st!==undefined && state.sel){ state.pop={...state.sel}; setDone(state.sel.h,state.me,state.sel.d,t.dataset.st==="1"); return; }
  if(t.dataset.tt && state.sel){ const {h,d}=state.sel; saveTodos(h,d,todoItems(h,d).map(i=>i.id===t.dataset.tt?{...i,done:!i.done}:i)); return; }
  if(t.dataset.td && state.sel){ const {h,d}=state.sel, it=todoItems(h,d).find(i=>i.id===t.dataset.td); if(!it) return;
    if(backend.removeMemo) backend.removeMemo(h,d,it); else saveTodos(h,d,todoItems(h,d).filter(i=>i.id!==t.dataset.td)); return; }
  if(t.dataset.hand){ try{ localStorage.setItem(HAND_KEY,t.dataset.hand); }catch(err){} document.querySelectorAll("[data-hand]").forEach(b=>b.setAttribute("aria-pressed", b===t)); render(); return; }
  if(t.dataset.th){ try{ localStorage.setItem(THEME_KEY,t.dataset.th); }catch(err){} document.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed", b===t)); applyPrefs(); return; }
  if(t.dataset.logh){ state.tab="week"; state.week=weekStart(parse(t.dataset.logd)); state.sel={h:t.dataset.logh,d:t.dataset.logd}; state.adding=false; render(); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.sel=null; try{localStorage.setItem("us-habits-tab",state.tab);}catch(err){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.tod){ document.querySelectorAll("[data-tod]").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if(t.dataset.feel && state.sel){ const {h,d}=state.sel, cur=check(h,state.me,d)||{}; state.pop={...state.sel}; setField(h,state.me,d,"feel",cur.feel===t.dataset.feel?null:t.dataset.feel); return; }
  if(t.dataset.emoji!==undefined){ emojiManual=true; setEmoji(t.dataset.emoji,true); return; }
  if(t.dataset.tpl!==undefined){ applyTemplate(TEMPLATES[+t.dataset.tpl]); return; }
  if(t.dataset.preset){ const sets={all:[0,1,2,3,4,5,6],weekdays:[1,2,3,4,5],weekends:[0,6],none:[]}; document.querySelectorAll(".dpill").forEach(b=>b.setAttribute("aria-pressed", sets[t.dataset.preset].includes(+b.dataset.dp))); return; }
  if(t.dataset.dp!==undefined){ t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")!=="true"); return; }
  if(t.dataset.me){ state.me=t.dataset.me; try{localStorage.setItem(LS_ME,state.me);}catch(err){} closeSheet(); render(); return; }
  const act=t.dataset.act;
  if(act==="close") closeSheet();
  else if(act==="toastdetails"){ clearTimeout(toastTimer); $("toast").hidden=true; if(toastTarget){ state.sel=toastTarget; state.adding=false; render(); } }
  else if(act==="pclose"){ state.sel=null; render(); }
  else if(act==="tipok"){ try{ localStorage.setItem("us-habits-tip","1"); }catch(err){} $("tip").hidden=true; }
  else if(act==="export"){ exportBackup(); }
  else if(act==="simfill"){ closeSheet(); simulate(); }
  else if(act==="simclear"){ closeSheet(); clearSim(); }
  else if(act==="emojipick"){ const pk=$("ePick"); if(pk) pk.hidden=!pk.hidden; }
  else if(act==="startadd"){ state.adding=true; render(); const i=$("todoIn"); if(i){ i.focus(); } }
  else if(act==="addtodo") addTodo();
  else if(act==="del"){ const h=state.habits[state.editing]; if(h && confirm(`Delete “${h.name}” and all its check-ins?`)){ closeSheet(); if(state.sel&&state.sel.h===h.id) state.sel=null; backend.deleteHabit(h.id); } }
  else if(act==="save"){
    const name=$("fName").value.trim(); if(!name){ $("fName").focus(); return; }
    const id=state.editing || ("h"+uid());
    const prev=state.habits[id]||{};
    const days=[...document.querySelectorAll(".dpill")].filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>+b.dataset.dp);
    if(!days.length){ alert("Pick at least one day."); return; }
    const {target, ...keep}=prev;
    const todB=document.querySelector('[data-tod][aria-pressed="true"]');
    backend.setHabit({...keep,id,name,emoji:$("fEmoji").value.trim(),days,tod:todB?todB.dataset.tod:"anytime",unit:$("fUnit").value.trim(),start:$("fStart").value||today(),
      created:prev.created||today(),order:prev.order||Date.now()});
    closeSheet();
  }
});
document.addEventListener("change",e=>{
  if(e.target.matches("input[data-amt]") && state.sel){ const v=parseFloat(e.target.value); e.target.blur(); setField(state.sel.h,state.me,state.sel.d,"amount",isNaN(v)?null:v); return; }
  if(e.target.matches("textarea[data-memo]") && state.sel){ const v=e.target.value; e.target.blur(); setMemo(state.sel.h,state.me,state.sel.d,v); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="todoIn"){ e.preventDefault(); addTodo(); } if(e.key==="Enter" && e.target.id==="fName"){ e.preventDefault(); const sv=document.querySelector('[data-act="save"]'); if(sv) sv.click(); } });
document.addEventListener("focusout",e=>{
  if(e.target.id==="todoIn" && !e.target.value.trim()){ setTimeout(()=>{ if(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act==="addtodo") return; state.adding=false; render(); },120); return; }
  setTimeout(()=>{ if(deferred) render(); },0);
});
document.addEventListener("input",e=>{ if(e.target.id==="fName"){ autoEmoji(e.target.value); return; } if(e.target.id==="eSearch"){ const r=searchEmoji(e.target.value); $("eGrid").innerHTML = r.length ? emojiButtons(r,$("fEmoji").value) : `<span class="enone">No matches. Try another word.</span>`; return; } if(e.target.tagName==="TEXTAREA"){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; } });

/* ---------- long press: open the day's dropdown ---------- */
let lpTimer=null, suppressClick=false;
document.addEventListener("pointerdown",e=>{
  suppressClick=false;
  const c=e.target.closest(".circle"); if(!c||c.disabled) return;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{
    suppressClick=true;
    const {h,d}=c.dataset;
    state.sel = (state.sel&&state.sel.h===h&&state.sel.d===d) ? null : {h,d}; state.adding=false;
    if(navigator.vibrate) navigator.vibrate(10);
    render();
  },450);
});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpTimer)));
document.addEventListener("contextmenu",e=>{ if(e.target.closest(".circle")) e.preventDefault(); });

/* ---------- swipe the habits left/right to change week ---------- */
function changeWeek(n){
  state.week=addDays(state.week,7*n); state.sel=null; render();
  if(backend.ensureWeek) backend.ensureWeek(state.week);
  const l=$("list"); l.classList.remove("slide-l","slide-r"); void l.offsetWidth; l.classList.add(n>0?"slide-l":"slide-r");
}
let sx=0, sy=0, swiping=false;
document.addEventListener("touchstart",e=>{
  if(e.target.closest(".panel,.sheet,input,textarea")){ swiping=false; return; }
  const p=e.touches[0]; sx=p.clientX; sy=p.clientY; swiping=true;
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!swiping) return; const p=e.touches[0];
  if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10) clearTimeout(lpTimer);
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!swiping) return; swiping=false;
  if(state.tab!=="week") return;
  const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ suppressClick=true; changeWeek(dx<0?1:-1); }
});

/* ---------- start ---------- */
backend = (FIREBASE_CONFIG && ROOM_ID) ? remote : local;
render();
Promise.resolve().then(()=>backend.init()).catch(()=>{ backend=local; local.init(); });
if(!state.me) whoForm();
</script>
</body>
</html>
